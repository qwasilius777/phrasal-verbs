let pool = [...MASTER_DB];
let currentBatch = 0; // 0: 0..99, 1: 100..199, 2: 200..264
let currentTest = 0;  // 0..4 (20 items each)
let userState = {};   // index in pool -> { val, status, hintLen }

function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

function init() {
    shuffleArray(pool);
    render();
}

function shuffleAll() {
    shuffleArray(pool);
    userState = {};
    currentTest = 0;
    render();
}

function selectBatch(b) {
    currentBatch = b;
    currentTest = 0;
    render();
}

function selectTest(t) {
    currentTest = t;
    render();
}

function getSliceBounds() {
    const batchStart = currentBatch * 100;
    const start = batchStart + currentTest * 20;
    const end = Math.min(start + 20, pool.length);
    return { start, end, batchStart };
}

function normalize(str) {
    return str.toLowerCase()
              .replace(/[.,!?'"()]/g, '')
              .replace(/\s+/g, ' ')
              .trim();
}

function checkItem(globalIdx) {
    const input = document.getElementById(`inp-${globalIdx}`);
    if (!input) return;
    const rawVal = input.value;
    const normVal = normalize(rawVal);
    const item = pool[globalIdx];

    if (!normVal) return;

    const isCorrect = item.a.some(ans => normalize(ans) === normVal);
    userState[globalIdx] = {
        ...(userState[globalIdx] || {}),
        val: rawVal,
        status: isCorrect ? 'correct' : 'incorrect'
    };
    renderQuestionState(globalIdx);
    updateScore();
}

function giveHint(globalIdx) {
    const item = pool[globalIdx];
    const target = item.a[0];
    const st = userState[globalIdx] || { val: '', hintLen: 0 };
    const nextLen = Math.min((st.hintLen || 0) + 2, target.length);
    const hintText = target.slice(0, nextLen);

    userState[globalIdx] = {
        ...st,
        val: hintText,
        hintLen: nextLen,
        status: null
    };
    const input = document.getElementById(`inp-${globalIdx}`);
    if (input) {
        input.value = hintText;
        input.focus();
    }
    renderQuestionState(globalIdx);
}

function renderQuestionState(globalIdx) {
    const card = document.getElementById(`card-${globalIdx}`);
    const fb = document.getElementById(`fb-${globalIdx}`);
    const item = pool[globalIdx];
    const st = userState[globalIdx];

    if (!card || !fb) return;
    card.classList.remove('correct', 'incorrect');
    fb.className = 'feedback';

    if (st && st.status === 'correct') {
        card.classList.add('correct');
        fb.classList.add('show', 'ok');
        fb.innerHTML = `✅ Верно! Варианты: <strong>${item.a.join(' / ')}</strong>`;
    } else if (st && st.status === 'incorrect') {
        card.classList.add('incorrect');
        fb.classList.add('show', 'err');
        fb.innerHTML = `❌ Не совсем. Правильный ответ: <strong>${item.a[0]}</strong> (все формы: ${item.a.join(', ')})`;
    }
}

function checkAllInTest() {
    const { start, end } = getSliceBounds();
    for (let i = start; i < end; i++) {
        const input = document.getElementById(`inp-${i}`);
        const rawVal = input ? input.value : '';
        const normVal = normalize(rawVal);
        const item = pool[i];
        const isCorrect = normVal && item.a.some(ans => normalize(ans) === normVal);
        userState[i] = {
            ...(userState[i] || {}),
            val: rawVal,
            status: isCorrect ? 'correct' : 'incorrect'
        };
        renderQuestionState(i);
    }
    updateScore();
}

function showAllAnswersInTest() {
    const { start, end } = getSliceBounds();
    for (let i = start; i < end; i++) {
        const item = pool[i];
        userState[i] = {
            val: item.a[0],
            status: 'correct'
        };
        const input = document.getElementById(`inp-${i}`);
        if (input) input.value = item.a[0];
        renderQuestionState(i);
    }
    updateScore();
}

function resetCurrentTest() {
    const { start, end } = getSliceBounds();
    for (let i = start; i < end; i++) {
        delete userState[i];
    }
    render();
}

function updateScore() {
    const { start, end } = getSliceBounds();
    let correctCount = 0;
    const total = end - start;
    for (let i = start; i < end; i++) {
        if (userState[i] && userState[i].status === 'correct') correctCount++;
    }
    const batchNames = ['Сет А', 'Сет Б', 'Сет В'];
    document.getElementById('testTitle').textContent = `${batchNames[currentBatch]} — Тест ${currentTest + 1} (вопросы ${start + 1}–${end})`;
    document.getElementById('scoreDisplay').textContent = `Правильно: ${correctCount} / ${total}`;
}

function render() {
    // Update batch buttons
    const batchBtns = document.querySelectorAll('#batchSelector .btn');
    batchBtns.forEach((b, idx) => b.classList.toggle('active', idx === currentBatch));

    // Update test tabs
    const testBtns = document.querySelectorAll('#testTabs .btn');
    const batchStart = currentBatch * 100;
    testBtns.forEach((b, idx) => {
        const tStart = batchStart + idx * 20;
        const tEnd = Math.min(tStart + 20, pool.length);
        if (tStart >= pool.length) {
            b.style.display = 'none';
        } else {
            b.style.display = 'inline-block';
            b.textContent = `Тест ${idx + 1} (${tStart + 1}–${tEnd})`;
            b.classList.toggle('active', idx === currentTest);
        }
    });

    const { start, end } = getSliceBounds();
    const container = document.getElementById('questionsContainer');
    container.innerHTML = '';

    for (let i = start; i < end; i++) {
        const item = pool[i];
        const st = userState[i] || {};
        const localNum = i - start + 1;

        const formattedSentence = item.s.replace(/___/g, '<strong>______</strong>');

        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `card-${i}`;

        card.innerHTML = `
            <div class="q-header">
                <span>Вопрос #${localNum} (общий #${i + 1})</span>
                <span class="unit-badge">${item.u}</span>
            </div>
            <div class="sentence">
                ${formattedSentence} <span class="ru-hint">(${item.ru})</span>
            </div>
            <div class="input-row">
                <input type="text"
                       id="inp-${i}"
                       class="answer-input"
                       placeholder="Впиши фразовый глагол на английском..."
                       value="${st.val ? st.val.replace(/"/g, '&quot;') : ''}"
                       oninput="userState[${i}] = {...(userState[${i}]||{}), val: this.value}"
                       onkeydown="if(event.key==='Enter') checkItem(${i})">
                <button class="btn btn-sm btn-primary" onclick="checkItem(${i})">Проверить</button>
                <button class="btn btn-sm btn-outline" onclick="giveHint(${i})" title="Открыть пару букв">💡 Буква</button>
            </div>
            <div class="feedback" id="fb-${i}"></div>
        `;
        container.appendChild(card);
        renderQuestionState(i);
    }

    updateScore();
}

init();
</script>
